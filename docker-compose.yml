# Solo para pruebas en el computador del equipo. En Azure todo corre en Container Apps.
#   cp .env.example .env    (y completar las claves)
#   docker compose up --build
#   Frontend: abrir web/index.html con config.js apuntando a http://127.0.0.1:8000
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ADMIN_PASSWORD}
    volumes:
      - mysql-datos:/var/lib/mysql
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_ADMIN_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  db-init:
    build: { context: ., dockerfile: services/db-init/Dockerfile }
    environment:
      MYSQL_HOST: mysql
      MYSQL_TLS: "false"
      MYSQL_DATABASE: ${MYSQL_DATABASE:-securechain}
      MYSQL_ADMIN_USER: root
      MYSQL_ADMIN_PASSWORD: ${MYSQL_ADMIN_PASSWORD}
      INGESTA_PASSWORD: ${INGESTA_PASSWORD}
      API_PASSWORD: ${API_PASSWORD}
    depends_on:
      mysql: { condition: service_healthy }

  binance-ws:
    build: { context: ., dockerfile: services/binance-ws/Dockerfile }
    environment:
      MYSQL_HOST: mysql
      MYSQL_TLS: "false"
      MYSQL_DATABASE: ${MYSQL_DATABASE:-securechain}
      MYSQL_USER: ingesta
      MYSQL_PASSWORD: ${INGESTA_PASSWORD}
      BINANCE_SIMBOLOS: ${BINANCE_SIMBOLOS:-btcusdt,ethusdt,solusdt,bnbusdt,xrpusdt,adausdt}
    depends_on:
      db-init: { condition: service_completed_successfully }
    restart: unless-stopped

  api-flask:
    build: { context: ., dockerfile: services/api-flask/Dockerfile }
    environment:
      MYSQL_HOST: mysql
      MYSQL_TLS: "false"
      MYSQL_DATABASE: ${MYSQL_DATABASE:-securechain}
      MYSQL_USER: api_lectura
      MYSQL_PASSWORD: ${API_PASSWORD}
      CORS_ORIGENES: "null,http://127.0.0.1:5500,http://localhost:5500"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db-init: { condition: service_completed_successfully }
    restart: unless-stopped

volumes:
  mysql-datos:
